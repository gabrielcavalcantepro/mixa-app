services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mixa
      POSTGRES_PASSWORD: mixa
      POSTGRES_DB: mixa_app
    ports:
      # 5433 (não 5432) pra rodar ao lado do Postgres do mixa-catalogo
      # sem colisão de porta — bancos separados, nunca compartilhados.
      - "5433:5432"
    volumes:
      - mixa_app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mixa -d mixa_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mixa_app_postgres_data:
